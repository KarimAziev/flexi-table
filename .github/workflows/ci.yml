name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Emacs ${{ matrix.emacs-version }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - emacs-version: "29.1"
            experimental: false
          - emacs-version: "30.1"
            experimental: false
          - emacs-version: snapshot
            experimental: true
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}
      - name: Show Emacs version
        run: emacs --version
      - name: Install dependencies
        run: make deps
      - name: Byte-compile
        run: make compile
      - name: Run ERT tests
        run: make test

  lint:
    name: Lisp and package metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@master
        with:
          version: "30.1"
      - name: Install dependencies
        run: make deps
      - name: Run Checkdoc and package-lint
        run: make lint
